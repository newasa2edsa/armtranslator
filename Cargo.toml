[workspace]
resolver = "2"
members = [
    "crates/armt-core",
    "crates/armt-decoder",
    "crates/armt-jit",
    "crates/armt-apple",
    "crates/armt-hw",
    "crates/armt-vm",
    "crates/armt-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
ureq = "2.12"
flate2 = "1"
plist = "1"
lzfse_rust = "0.2"
clap = { version = "4", features = ["derive"] }
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"
minifb = "0.28"

armt-core = { path = "crates/armt-core" }
armt-decoder = { path = "crates/armt-decoder" }
armt-jit = { path = "crates/armt-jit" }
armt-apple = { path = "crates/armt-apple" }
armt-hw = { path = "crates/armt-hw" }
armt-vm = { path = "crates/armt-vm" }
